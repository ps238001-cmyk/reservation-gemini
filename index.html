<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miel | ご予約</title>
  
  <style>
    /* --------------------------
       基本設定
    -------------------------- */
    body {
      margin: 0;
      padding: 0;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      background-color: #f9f9f9;
      color: #333;
    }

    /* ホームに戻るリンク */
    .back-link {
      padding: 20px;
      background-color: #f9f9f9;
    }
    .back-link a {
      text-decoration: none;
      color: #c5a059;
      font-weight: bold;
    }

    .container {
      max-width: 600px;
      margin: 20px auto 60px auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
      position: relative;
      min-height: 400px;
    }

    h1 {
      text-align: center;
      color: #333;
      font-weight: normal;
      margin-bottom: 10px;
    }
    
    .title-border {
      width: 40px;
      height: 3px;
      background-color: #c5a059;
      margin: 0 auto 30px auto;
    }

    p.subtitle {
      text-align: center;
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 40px;
    }

    /* --------------------------
       カレンダー部分
    -------------------------- */
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 0 10px;
    }

    .calendar-header h2 {
      font-size: 1.2rem;
      color: #555;
      font-weight: normal;
    }

    .nav-btn {
      border: 1px solid #c5a059;
      background: white;
      color: #c5a059;
      width: 40px;
      height: 40px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1.2rem;
      transition: 0.3s;
    }
    
    .nav-btn:hover {
      background: #c5a059;
      color: white;
    }

    .nav-btn:disabled {
      border-color: #eee;
      color: #ccc;
      cursor: not-allowed;
      background: white;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
      margin-bottom: 40px;
    }

    .day-name {
      text-align: center;
      font-size: 0.8rem;
      color: #888;
      padding: 5px 0;
    }

    .date-btn {
      background: white;
      border: 1px solid #eee;
      padding: 10px 0;
      border-radius: 4px;
      cursor: pointer;
      color: #555;
      font-family: inherit;
      transition: 0.3s;
    }

    .date-btn:hover {
      border-color: #c5a059;
      background: #fff8e1;
    }

    .date-btn.selected {
      background-color: #c5a059;
      color: white;
      border-color: #c5a059;
    }
    
    .empty-cell { height: 40px; }

    /* --------------------------
       時間・入力フォーム
    -------------------------- */
    #time-section {
      display: none;
      margin-bottom: 40px;
      animation: fadeIn 0.5s ease;
    }

    .time-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      gap: 10px;
    }

    .time-btn {
      padding: 10px;
      background: white;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      color: #555;
    }

    .time-btn:hover {
      border-color: #c5a059;
      color: #c5a059;
    }

    .time-btn.selected {
      background-color: #c5a059;
      color: white;
      border-color: #c5a059;
    }

    .form-group { margin-bottom: 25px; }
    label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: #666; }
    
    input[type="text"], input[type="tel"], select {
      width: 100%; padding: 15px; border: 1px solid #eee;
      border-radius: 4px; font-size: 1rem; box-sizing: border-box;
      background: #fdfdfd; font-family: inherit;
    }
    input:focus, select:focus { outline: none; border-color: #c5a059; }

    /* ボタン共通 */
    .submit-btn, .
